<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Games Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
        }

        .games-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
        }

        .game-item {
            position: relative;
            width: 80px;
            height: 80px;
            opacity: 0.4;
            transition: all 0.3s ease;
            filter: grayscale(80%) brightness(0.5);
        }

        .game-item.active {
            opacity: 1;
            filter: grayscale(0%) brightness(1.1) drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
            transform: scale(1.15);
        }

        .game-item.completed {
            opacity: 0.8;
            filter: grayscale(0%) brightness(0.9) drop-shadow(0px 0px 10px rgb(0, 255, 0));
        }

        .game-item.completed .game-counter {
            background: #1fe400;
            color: #ffffff;
            /* border-color: #00ff88; */
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.9);
            padding: 0 5px;
        }

        .game-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
            background: rgba(20, 20, 30, 0.0);
        }

        .game-counter {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            /* justify-self: anchor-center; */
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            min-width: 32px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            
        }

        .game-item.active .game-counter {
            background: #000000;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
            padding: 0 5px;
        }

        .total-counter {
            position: relative;
            width: 80px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            padding: 0 5px;
        }

        .skull-icon {
            font-size: 36px;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .total-number {
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            font-size: 30px;
            font-weight: bold;
            background: rgb(255 0 0 / 90%);
            border-radius: 30px;
            min-width: 50px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 8px rgb(255 0 0 / 50%);
            padding: 0 5px;
        }
    </style>
</head>
<body>
    <div class="games-container" id="gamesContainer">
        <!-- Los juegos se generarán dinámicamente -->
    </div>

    <script>
        // Configuración de juegos
        const GAMES = {
            apex: {
                name: 'Apex Legends',
                logo: 'https://images.seeklogo.com/logo-png/38/2/apex-logo-png_seeklogo-383506.png'
            },
            warzone: {
                name: 'Warzone',
                logo: 'https://upload.wikimedia.org/wikipedia/commons/e/e6/Call_of_Duty_Warzone_Logo.png'
            },
            fortnite: {
                name: 'Fortnite',
                logo: 'https://static.vecteezy.com/system/resources/previews/027/127/524/non_2x/fortnite-logo-fortnite-icon-transparent-free-png.png'
            },
            zerobuild: {
                name: 'Fortnite: Zero Build',
                logo: 'https://cdn2.steamgriddb.com/logo/46068977c54a032529068c82377fddae.png'
            },
            pubg: {
                name: 'PUBG',
                logo: 'https://logodownload.org/wp-content/uploads/2019/12/pubg-logo-0.png'
            },
            battlefield: {
                name: 'Battlefield',
                logo: 'https://assets.gam3s.gg/battlefield_6_redsec_logo_c30afd43bb.png'
            },
            freefire: {
                name: 'Free Fire',
                logo: 'https://upload.wikimedia.org/wikipedia/en/c/c5/Logo_of_Garena_Free_Fire.png'
            }
        };

        // Estado del overlay
        let state = {
            games: {},
            activeGame: null,
            completedGames: new Set(), // Juegos completados
            totalMatches: 0,
            ws: null
        };

        // Configuración desde URL
        const urlParams = new URLSearchParams(window.location.search);
        const CONFIG = {
            streamer: urlParams.get('streamer') || 'noitx',
            moderator: urlParams.get('moderator') || 'all',
            chatroomId: null,
            channelId: null
        };

        // Inicializar juegos
        function initGames() {
            Object.keys(GAMES).forEach(gameKey => {
                state.games[gameKey] = {
                    name: GAMES[gameKey].name,
                    logo: GAMES[gameKey].logo,
                    matches: 0
                };
            });
            renderGames();
        }

        // Renderizar juegos en el DOM
        function renderGames() {
            const container = document.getElementById('gamesContainer');
            container.innerHTML = '';

            // Renderizar juegos individuales
            Object.keys(state.games).forEach(gameKey => {
                const game = state.games[gameKey];
                const isActive = state.activeGame === gameKey;
                const isCompleted = state.completedGames.has(gameKey);
                
                const item = document.createElement('div');
                item.className = `game-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
                item.innerHTML = `
                    <img src="${game.logo}" alt="${game.name}" class="game-logo" onerror="this.style.background='rgba(50,50,70,0.8)'">
                    <div class="game-counter">${game.matches}</div>
                `;

                container.appendChild(item);
            });

            // Agregar contador total con calavera
            const totalItem = document.createElement('div');
            totalItem.className = 'total-counter';
            totalItem.innerHTML = `
                <div class="skull-icon">💀</div>
                <div class="total-number">${state.totalMatches}</div>
            `;
            container.appendChild(totalItem);
        }

        // Actualizar contador de partidas
        function updateGameMatches(gameKey, change) {
            if (state.games[gameKey]) {
                state.games[gameKey].matches += change;
                
                if (state.games[gameKey].matches < 0) {
                    state.games[gameKey].matches = 0;
                }

                if (change > 0) {
                    state.activeGame = gameKey;
                }

                // Recalcular total
                state.totalMatches = Object.values(state.games).reduce((sum, game) => sum + game.matches, 0);

                renderGames();
            }
        }

        // Marcar juego como completado
        function markGameCompleted(gameKey) {
            if (state.games[gameKey]) {
                state.completedGames.add(gameKey);
                state.activeGame = null; // Quitar estado activo
                renderGames();
                console.log('✅ Juego completado:', gameKey);
            }
        }

        // Obtener información del canal
        async function getChannelInfo() {
            try {
                const response = await fetch(`https://kick.com/api/v2/channels/${CONFIG.streamer}`);
                const data = await response.json();
                
                CONFIG.chatroomId = data.chatroom.id;
                CONFIG.channelId = data.id;
                
                console.log('📡 Conectado:', CONFIG.streamer);
                return true;
            } catch (error) {
                console.error('❌ Error:', error);
                return false;
            }
        }

        // Conectar al WebSocket de Kick
        async function connectWebSocket() {
            const success = await getChannelInfo();
            if (!success) return;

            const wsUrl = "wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0&flash=false";
            state.ws = new WebSocket(wsUrl);

            state.ws.onopen = () => {
                console.log('🟢 WebSocket conectado');
                
                const channels = [
                    `chatrooms.${CONFIG.chatroomId}.v2`,
                    `chatroom_${CONFIG.chatroomId}`,
                    `channel.${CONFIG.channelId}`
                ];

                channels.forEach(channel => {
                    state.ws.send(JSON.stringify({
                        event: "pusher:subscribe",
                        data: { auth: "", channel: channel }
                    }));
                });
            };

            state.ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.event === 'App\\Events\\ChatMessageEvent') {
                        const msgData = JSON.parse(data.data);
                        handleChatMessage(msgData);
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            };

            state.ws.onclose = () => {
                console.log('🔴 Desconectado');
                setTimeout(() => connectWebSocket(), 5000);
            };
        }

        // Manejar mensajes del chat
        function handleChatMessage(msgData) {
            const username = msgData.sender.username.toLowerCase();
            const content = msgData.content.trim();
            const sender = msgData.sender;
            
            // Verificar si es moderador/broadcaster
            let isModerator = false;
            
            if (sender.identity?.badges) {
                isModerator = sender.identity.badges.some(badge => 
                    badge.type === 'moderator' || 
                    badge.type === 'broadcaster' || 
                    badge.type === 'owner'
                );
            }
            
            if (!isModerator && sender.slug) {
                isModerator = sender.slug.toLowerCase() === CONFIG.streamer.toLowerCase();
            }

            // Verificar permisos
            let hasPermission = false;
            if (CONFIG.moderator === 'all') {
                hasPermission = isModerator;
            } else {
                hasPermission = isModerator && username === CONFIG.moderator.toLowerCase();
            }

            if (!hasPermission) return;

            // Parsear comando para completado: !overlay juego completado
            const completedRegex = /^!overlay\s+(\w+)\s+completado$/i;
            const completedMatch = content.match(completedRegex);

            if (completedMatch) {
                const gameKey = completedMatch[1].toLowerCase();
                console.log('✅ Comando completado:', gameKey);

                if (state.games[gameKey]) {
                    markGameCompleted(gameKey);
                }
                return;
            }

            // Parsear comando normal: !overlay juego +1 o !overlay juego -1
            const commandRegex = /^!overlay\s+(\w+)\s+([\+\-]?\d+)$/i;
            const match = content.match(commandRegex);

            if (match) {
                const gameKey = match[1].toLowerCase();
                let change = parseInt(match[2]);
                
                if (match[2][0] !== '+' && match[2][0] !== '-') {
                    change = Math.abs(change);
                }

                console.log('🎮', gameKey, change);

                if (state.games[gameKey]) {
                    updateGameMatches(gameKey, change);
                }
            }
        }

        // Inicialización
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Overlay iniciado');
            initGames();
            renderGames();
            connectWebSocket();
        });
    </script>
</body>
</html>
