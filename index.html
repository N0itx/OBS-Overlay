<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Kick Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
        }

        .games-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
        }

        .counter-item {
            position: relative;
            width: 80px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            padding: 0 5px;
        }

        .counter-icon {
            font-size: 36px;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .counter-icon-img {
            width: 45px;
            height: 45px;
            margin-bottom: 4px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .counter-number {
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            font-size: 30px;
            font-weight: bold;
            border-radius: 30px;
            min-width: 50px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 0 5px;
        }

        .counter-number.kills {
            background: rgb(255 0 0 / 90%);
            box-shadow: 0 2px 8px rgb(255 0 0 / 50%);
        }

        .counter-number.deaths {
            background: rgb(30 30 30 / 90%);
            box-shadow: 0 2px 8px rgb(0 0 0 / 50%);
        }
    </style>
</head>
<body>
    <div class="games-container" id="gamesContainer">
        <!-- Los contadores se generan dinámicamente -->
    </div>

    <script>
        // Ícono para el contador de muertes
        const DEATH_ICON = 'https://cdn-icons-png.flaticon.com/512/1301/1301675.png';

        // Estado del overlay
        let state = {
            kills: 0,
            deaths: 0,
            ws: null
        };

        // Configuración desde URL
        const urlParams = new URLSearchParams(window.location.search);
        const CONFIG = {
            streamer: urlParams.get('streamer') || 'noitx',
            moderator: urlParams.get('moderator') || 'all',
            chatroomId: null,
            channelId: null
        };

        // Renderizar contadores en el DOM
        function renderCounters() {
            const container = document.getElementById('gamesContainer');
            container.innerHTML = `
                <div class="counter-item">
                    <div class="counter-icon">💀</div>
                    <div class="counter-number kills">${state.kills}</div>
                </div>
                <div class="counter-item">
                    <img src="${DEATH_ICON}" alt="Muertes" class="counter-icon-img">
                    <div class="counter-number deaths">${state.deaths}</div>
                </div>
            `;
        }

        // Actualizar contador (kill o muerte)
        function updateCounter(type, change) {
            if (type === 'kill') {
                state.kills = Math.max(0, state.kills + change);
            } else if (type === 'muerte') {
                state.deaths = Math.max(0, state.deaths + change);
            }
            console.log('🎯', type, change, '->', type === 'kill' ? state.kills : state.deaths);
            renderCounters();
        }

        // Obtener información del canal
        async function getChannelInfo() {
            try {
                const response = await fetch(`https://kick.com/api/v2/channels/${CONFIG.streamer}`);
                const data = await response.json();

                CONFIG.chatroomId = data.chatroom.id;
                CONFIG.channelId = data.id;

                console.log('📡 Conectado:', CONFIG.streamer);
                return true;
            } catch (error) {
                console.error('❌ Error:', error);
                return false;
            }
        }

        // Conectar al WebSocket de Kick
        async function connectWebSocket() {
            const success = await getChannelInfo();
            if (!success) return;

            const wsUrl = "wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0&flash=false";
            state.ws = new WebSocket(wsUrl);

            state.ws.onopen = () => {
                console.log('🟢 WebSocket conectado');

                const channels = [
                    `chatrooms.${CONFIG.chatroomId}.v2`,
                    `chatroom_${CONFIG.chatroomId}`,
                    `channel.${CONFIG.channelId}`
                ];

                channels.forEach(channel => {
                    state.ws.send(JSON.stringify({
                        event: "pusher:subscribe",
                        data: { auth: "", channel: channel }
                    }));
                });
            };

            state.ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.event === 'App\\Events\\ChatMessageEvent') {
                        const msgData = JSON.parse(data.data);
                        handleChatMessage(msgData);
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            };

            state.ws.onclose = () => {
                console.log('🔴 Desconectado');
                setTimeout(() => connectWebSocket(), 5000);
            };
        }

        // Manejar mensajes del chat
        function handleChatMessage(msgData) {
            const username = msgData.sender.username.toLowerCase();
            const content = msgData.content.trim();
            const sender = msgData.sender;

            // Verificar si es moderador/broadcaster
            let isModerator = false;

            if (sender.identity?.badges) {
                isModerator = sender.identity.badges.some(badge =>
                    badge.type === 'moderator' ||
                    badge.type === 'broadcaster' ||
                    badge.type === 'owner'
                );
            }

            if (!isModerator && sender.slug) {
                isModerator = sender.slug.toLowerCase() === CONFIG.streamer.toLowerCase();
            }

            // Verificar permisos
            let hasPermission = false;
            if (CONFIG.moderator === 'all') {
                hasPermission = isModerator;
            } else {
                hasPermission = isModerator && username === CONFIG.moderator.toLowerCase();
            }

            if (!hasPermission) return;

            // Parsear comando: !overlay kill +1  /  !overlay muerte +1
            const commandRegex = /^!overlay\s+(kill|muerte)\s+([\+\-]?\d+)$/i;
            const match = content.match(commandRegex);

            if (match) {
                const type = match[1].toLowerCase();
                let change = parseInt(match[2]);

                if (match[2][0] !== '+' && match[2][0] !== '-') {
                    change = Math.abs(change);
                }

                updateCounter(type, change);
            }
        }

        // Inicialización
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Overlay Rust iniciado');
            renderCounters();
            connectWebSocket();
        });
    </script>
</body>
</html>
